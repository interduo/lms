name: Psalm Security Scan

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '35 8 */2 * *'

permissions:
  contents: read

jobs:
  php-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install project dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Psalm
        run: |
          mkdir -p /tmp/psalm
          cd /tmp/psalm
          composer require --no-interaction vimeo/psalm:6.16.1

      - name: Psalm version
        run: /tmp/psalm/vendor/bin/psalm --version

      - name: Psalm Security Scan
        run: /tmp/psalm/vendor/bin/psalm \
          --output-format=sarif \
          --taint-analysis \
          --report=results.sarif

      - name: Upload Security Analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
