name: Psalm Security Scan

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '35 8 */2 * *'

permissions:
  contents: read

jobs:
  php-security:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Install LMS dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Psalm 6.16.1
        run: |
          mkdir -p /tmp/psalm
          cd /tmp/psalm
          composer init --no-interaction
          composer require --no-interaction vimeo/psalm:6.16.1

      - name: Check Psalm version
        run: /tmp/psalm/vendor/bin/psalm --version

      - name: Psalm Security Scan
        run: |
          /tmp/psalm/vendor/bin/psalm \
            --output-format=github \
            --taint-analysis \
            --report=results.sarif

      - name: Upload Security Analysis results to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
